syntax = "proto3";
package android_player;

message textRuns {
    message textRun {
        string text = 1;
    }
    repeated textRun run = 1;
}
message audioTrackData {
    string displayName = 4;
    string vssId = 5;
    optional int32 isDefault = 6;
}
message xtags {
    message metadata {
        string key = 1;
        string value = 2;
    }
    repeated metadata part = 1;
}
message numberRange {
    int32 start = 3;
    int32 end = 4;
}
message root {
    message responseContext {
        string visitorData = 2;
        message clientType {
            int32 service = 1;
            message clientParam {
                string name = 1;
                string value = 2;
            }
            repeated clientParam param = 2;
        }
        repeated clientType client = 6;
        int32 maxAgeSeconds = 7;
    }
    responseContext context = 1;
    message playabilityStatus {
        optional int32 status = 1;
        string error = 2;
        optional int32 playableInEmbed = 9;
        string contentParams = 31;
    }
    playabilityStatus playability = 2;
    message playerFormats {
        int32 expiresInSeconds = 1;
        message format {
            int32 formatId = 1;
            string url = 2;
            string mimeType = 5;
            int32 totalBitrate = 6;
            int32 videoWidth = 7;
            int32 videoHeight = 8;
            numberRange initRange = 9;
            numberRange indexRange = 10;
            int64 lastChanged = 11;
            string videoQuality = 16;
            string xtags = 23;
            int32 fps = 25;
            string qualityLabel = 26;
            optional int32 projectionType = 27;
            /*^^^ 360deg:
            
            2 == EQUIRECTANGULAR (e.g. ZZyBG6UsvoQ)
            4 == MESH (e.g. HCpnhMH1vXs)*/
            repeated audioTrackData audioTrack = 28;
            int32 audioBitrate = 44;
            int32 audioSample = 45;
            int32 audioChannels = 46;
            optional bool isDrc = 49;
        }
        repeated format nondashFormat = 2;
        repeated format dashFormat = 3;
        string serverAbrStreamingUrl = 15;
    }
    playerFormats formats = 4;
    message statUrls {
        message statUrl {
            string url = 1;
            repeated bytes sendHeader = 3;
        }
        statUrl playback = 1;
        statUrl delayplay = 2;
        statUrl watchtime = 3;
        statUrl ptracking = 4;
        statUrl qoe = 5;
        statUrl apiStats = 13;
    }
    statUrls stats = 9;
    message captionTracks {
        message contents {
            message captionTrack {
                string url = 1;
                repeated textRuns name = 2;
                string vssId = 3;
                string languageCode = 4;
                string kind = 5;
                optional int32 isTranslatable = 7;
                string trackName = 11;
            }
            repeated captionTrack track = 1;
            optional int32 defaultAudioTrackIndex = 4;
        }
        contents content = 51621377;
    }
    captionTracks captions = 10;
    message metadata {
        string id = 1;
        string title = 15;
        int32 videoLength = 16;
        repeated string keyword = 18;
        string channelId = 19;
        string description = 21;
        message thumbList {
            message thumb {
                string url = 1;
                int32 width = 2;
                int32 height = 3;
            }
            repeated thumb thumbnail = 1;
        }
        thumbList thumbnails = 25;
        string viewCount = 32;
        string authorName = 33;
        optional bool isOwnerViewing = 20;
        optional bool isCrawlable = 22;
        optional bool allowRatings = 31;
        optional bool isPrivate = 37;
        optional bool isUnpluggedCorpus = 38;
        optional bool isLiveContent = 41;
    }
    metadata videoMetadata = 11;
    message storyboardData {
        message playerStoryboardSpecRenderer {
            string spec = 1;
            int32 recommendedLevel = 3;
        }
        repeated playerStoryboardSpecRenderer sb = 55735497;
    }
    storyboardData storyboards = 16;
    bytes trackingParams = 21;
    message attestationMsg {
        message playerAttestationRenderer {
            string challenge = 1;
        }
        playerAttestationRenderer attest = 59961494;
    }
    attestationMsg attestation = 22;

    message playerConfig {
        message mediaCommonConfig {
            message mediaustreamerrequestconfig {
                bytes mediaustreamerrequestConfig = 4;
            }
            mediaustreamerrequestconfig mediaustreamerconfig = 2;
        }
        mediaCommonConfig mediacommonconfigmsg = 215771584;
    }
    playerConfig playerconfigmsg = 15;
}